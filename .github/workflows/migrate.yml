name: Apply migrations

# Manual on purpose: this changes the production database. Without "apply" it
# only lists what Supabase would run. Setup: docs/migrations.md.
on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Apply the pending migrations (otherwise only list them)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: migrate
  cancel-in-progress: false

jobs:
  migrate:
    name: Supabase migrations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Protect this environment in GitHub (required reviewers) so applying needs a second pair of eyes.
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase link --project-ref "${{ vars.SUPABASE_PROJECT_REF }}"
      - name: Pending migrations
        run: supabase db push --dry-run
      - name: Apply
        if: ${{ inputs.apply }}
        run: supabase db push
